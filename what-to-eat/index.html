<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="吃嘛 —— 拯救干饭人的选择困难症，从 1143 道真实食堂菜品里替你做决定。" />
  <title>吃嘛 · 拯救选择困难症</title>
  <link rel="stylesheet" href="styles.css?v=20261024-7" />
</head>
<body>
  <div class="app">
    <!-- 页头 -->
    <header class="top reveal" style="--d:0">
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 2-2.3 2.3a3 3 0 0 0 0 4.2l1.8 1.8a3 3 0 0 0 4.2 0L22 8"/><path d="M15 15 3.3 3.3a4.2 4.2 0 0 0 0 6l7.3 7.3c.7.7 2 .7 2.8 0L15 15Zm0 0 7 7"/><path d="m2.1 21.8 6.4-6.3"/><path d="m19 5-7 7"/></svg>
      </div>
      <h1>吃<span class="accent">嘛</span>？</h1>
      <p class="date" id="dateLine"></p>
    </header>

    <!-- Hero 插画 -->
    <figure class="hero reveal" style="--d:1">
      <img src="assets/hero.jpg" alt="食堂美食插画：盖饭、牛肉面、小炒与轻食沙拉" onerror="this.parentElement.classList.add('noimg')" />
    </figure>

    <!-- 偏好输入 -->
    <section class="panel reveal" style="--d:2">
      <label for="pref">我的饮食偏好 <span class="opt">（可不填，随意聊聊）</span></label>
      <textarea id="pref" rows="2" placeholder="例如：减肥、预算 15 元、不想吃辣…"></textarea>
      <div class="chips" aria-label="快捷偏好">
        <button type="button" class="chip" data-add="减肥">减脂轻食</button>
        <button type="button" class="chip" data-add="预算15元">预算 15 元</button>
        <button type="button" class="chip" data-add="不想吃辣">不吃辣</button>
        <button type="button" class="chip" data-add="想吃肉">无肉不欢</button>
        <button type="button" class="chip" data-add="想吃面食">来碗面</button>
        <button type="button" class="chip" data-add="清淡养生">清淡养生</button>
      </div>
      <div class="pref-foot">
        <button type="button" id="profileBtn" class="ghost-btn compact">建立口味档案</button>
        <p id="profileSummary" class="profile-summary" hidden></p>
      </div>
    </section>

    <!-- 决定按钮 -->
    <div class="actions reveal" style="--d:3">
      <button type="button" id="decide" class="decide">
        <svg class="dice-ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="12" height="12" x="2" y="10" rx="2" ry="2"/><path d="m17.92 14 3.5-3.5a2.24 2.24 0 0 0 0-3l-5-4.92a2.24 2.24 0 0 0-3 0L10 6"/><path d="M6 18h.01"/><path d="M10 14h.01"/><path d="M15 6h.01"/><path d="M18 9h.01"/></svg>
        <span class="spinner" aria-hidden="true"></span>
        <span id="decideText">替我决定！</span>
      </button>
      <button type="button" id="novelty" class="ghost-btn novelty-btn">
        <svg class="ic" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"/><path d="M20 2v4"/><path d="M22 4h-4"/><circle cx="4" cy="20" r="2"/></svg>
        试试新的！
      </button>
    </div>

    <!-- 结果区 -->
    <section id="result" class="reveal" style="--d:4" aria-live="polite">
      <div class="empty">
        <svg class="ghost-ic" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 2-2.3 2.3a3 3 0 0 0 0 4.2l1.8 1.8a3 3 0 0 0 4.2 0L22 8"/><path d="M15 15 3.3 3.3a4.2 4.2 0 0 0 0 6l7.3 7.3c.7.7 2 .7 2.8 0L15 15Zm0 0 7 7"/><path d="m2.1 21.8 6.4-6.3"/><path d="m19 5-7 7"/></svg>
        <p class="empty-title">选择困难？让我来拍板</p>
        <p class="empty-hint">写下偏好，或直接点下面的按钮</p>
      </div>
    </section>

    <!-- 页脚 -->
    <footer class="foot reveal" style="--d:5">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
      数据来自汇百味 + 北山苑餐厅菜单与线下档口实拍（1143 道，持续扩充中） · 卡路里为品类估算值，仅供参考
    </footer>
  </div>

  <!-- 口味档案弹窗（首次使用可跳过） -->
  <div class="modal" id="profileModal" hidden>
    <div class="modal-backdrop" data-close="1"></div>
    <div class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="profileTitle">
      <div class="modal-head">
        <div>
          <h2 id="profileTitle">先认识一下你的口味</h2>
          <p>选几项就好，随时可以改；不想选也可以直接跳过。</p>
        </div>
        <button type="button" class="modal-x" data-close="1" aria-label="关闭">×</button>
      </div>
      <div class="modal-body">
        <section class="field">
          <h3>喜欢的口味 <span>可多选</span></h3>
          <div class="picks" id="flavorChips">
            <button type="button" class="pick" data-value="辣" aria-pressed="false">辣</button>
            <button type="button" class="pick" data-value="麻" aria-pressed="false">麻</button>
            <button type="button" class="pick" data-value="酸甜" aria-pressed="false">酸甜</button>
            <button type="button" class="pick" data-value="咸鲜" aria-pressed="false">咸鲜</button>
            <button type="button" class="pick" data-value="清淡" aria-pressed="false">清淡</button>
            <button type="button" class="pick" data-value="甜" aria-pressed="false">甜</button>
          </div>
        </section>
        <section class="field">
          <h3>荤素倾向</h3>
          <div class="seg" id="mainSeg">
            <button type="button" class="seg-btn" data-value="any" aria-pressed="true">都行</button>
            <button type="button" class="seg-btn" data-value="veg" aria-pressed="false">偏素</button>
            <button type="button" class="seg-btn" data-value="meat" aria-pressed="false">无肉不欢</button>
          </div>
        </section>
        <section class="field">
          <h3>每顿预算</h3>
          <div class="seg" id="budgetSeg">
            <button type="button" class="seg-btn" data-value="10" aria-pressed="false">≤10 元</button>
            <button type="button" class="seg-btn" data-value="10-15" aria-pressed="false">10-15 元</button>
            <button type="button" class="seg-btn" data-value="15-20" aria-pressed="false">15-20 元</button>
            <button type="button" class="seg-btn" data-value="any" aria-pressed="true">不限</button>
          </div>
        </section>
        <section class="field">
          <h3>避雷 <span>可不填</span></h3>
          <input type="text" id="avoidInput" placeholder="例如：香菜、肥肉、葱" />
        </section>
        <section class="field">
          <h3>显示模式</h3>
          <div class="seg" id="modeSeg">
            <button type="button" class="seg-btn" data-value="1" aria-pressed="true">单卡</button>
            <button type="button" class="seg-btn" data-value="3" aria-pressed="false">三卡</button>
          </div>
          <p class="field-hint">三卡一次给三个不同档口，点“整组换一个”一起刷新。</p>
        </section>
      </div>
      <div class="modal-foot">
        <button type="button" class="ghost-btn compact" id="profileSkip">先跳过，直接点菜</button>
        <button type="button" class="decide compact" id="profileSave">保存偏好</button>
      </div>
    </div>
  </div>

  <script src="mock.js?v=20261024-7" defer></script>
  <script src="data/data.js?v=20261024-7" defer></script>
  <script src="api.js?v=20261024-7" defer></script>
  <script src="app.js?v=20261024-7" defer></script>
</body>
</html>
